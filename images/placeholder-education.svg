<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-label="Illustration of a club education session">
  <rect width="900" height="1200" fill="#EFF4EC"/>

  <!-- greenbar rules -->
  <g fill="#E3EDE3">
    <rect x="0" y="90" width="900" height="60"/>
    <rect x="0" y="210" width="900" height="60"/>
    <rect x="0" y="330" width="900" height="60"/>
    <rect x="0" y="450" width="900" height="60"/>
    <rect x="0" y="570" width="900" height="60"/>
    <rect x="0" y="690" width="900" height="60"/>
    <rect x="0" y="810" width="900" height="60"/>
    <rect x="0" y="930" width="900" height="60"/>
    <rect x="0" y="1050" width="900" height="60"/>
  </g>

  <!-- presentation board -->
  <rect x="120" y="150" width="660" height="470" fill="#FBFAF6" stroke="#12241A" stroke-width="6"/>

  <!-- board contents: a ledger being taught -->
  <rect x="176" y="212" width="240" height="20" fill="#12241A"/>
  <rect x="176" y="256" width="150" height="12" fill="#64756A"/>
  <rect x="176" y="300" width="548" height="4" fill="#12241A"/>

  <g>
    <rect x="176" y="330" width="548" height="52" fill="#E3EDE3"/>
    <rect x="176" y="434" width="548" height="52" fill="#E3EDE3"/>
  </g>
  <g fill="#C6D3C7">
    <rect x="200" y="348" width="230" height="12"/>
    <rect x="200" y="400" width="280" height="12"/>
    <rect x="200" y="452" width="200" height="12"/>
    <rect x="200" y="504" width="250" height="12"/>
  </g>
  <g fill="#64756A">
    <rect x="620" y="348" width="80" height="12"/>
    <rect x="620" y="400" width="80" height="12"/>
    <rect x="620" y="452" width="80" height="12"/>
  </g>

  <!-- the highlighted teaching point -->
  <rect x="176" y="490" width="548" height="52" fill="#E3EDE3"/>
  <rect x="176" y="490" width="8" height="52" fill="#9E3B2E"/>
  <rect x="620" y="504" width="80" height="12" fill="#9E3B2E"/>

  <rect x="176" y="566" width="548" height="4" fill="#12241A"/>

  <!-- board stand -->
  <rect x="440" y="620" width="20" height="90" fill="#12241A"/>
  <rect x="330" y="700" width="240" height="14" fill="#12241A"/>

  <!-- audience, geometric and faceless.
       Shoulders overlap the head slightly so the two read as one
       body rather than a head floating above a shape. -->
  <g fill="#12241A">
    <circle cx="190" cy="848" r="46"/>
    <rect x="108" y="880" width="164" height="150" rx="48"/>
    <circle cx="710" cy="848" r="46"/>
    <rect x="628" y="880" width="164" height="150" rx="48"/>
  </g>

  <!-- the member presenting -->
  <g fill="#9E3B2E">
    <circle cx="450" cy="848" r="46"/>
    <rect x="368" y="880" width="164" height="150" rx="48"/>
  </g>

  <rect x="60" y="1074" width="780" height="4" fill="#12241A"/>
  <g fill="#64756A">
    <rect x="60" y="1106" width="170" height="10"/>
    <rect x="60" y="1138" width="110" height="10"/>
  </g>
</svg>
