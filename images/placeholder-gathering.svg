<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-label="Illustration of club members gathered around a table">
  <rect width="900" height="1200" fill="#EFF4EC"/>

  <!-- greenbar rules -->
  <g fill="#E3EDE3">
    <rect x="0" y="90" width="900" height="60"/>
    <rect x="0" y="210" width="900" height="60"/>
    <rect x="0" y="330" width="900" height="60"/>
    <rect x="0" y="450" width="900" height="60"/>
    <rect x="0" y="570" width="900" height="60"/>
    <rect x="0" y="690" width="900" height="60"/>
    <rect x="0" y="810" width="900" height="60"/>
    <rect x="0" y="930" width="900" height="60"/>
    <rect x="0" y="1050" width="900" height="60"/>
  </g>

  <!-- seated figures, geometric and faceless.
       Shoulders overlap the head slightly so the two read as one
       body rather than a head floating above a shape. -->
  <g fill="#12241A">
    <circle cx="215" cy="464" r="56"/>
    <rect x="118" y="504" width="194" height="196" rx="56"/>
    <circle cx="685" cy="464" r="56"/>
    <rect x="588" y="504" width="194" height="196" rx="56"/>
  </g>

  <!-- the member doing the talking -->
  <g fill="#9E3B2E">
    <circle cx="450" cy="424" r="64"/>
    <rect x="342" y="470" width="216" height="230" rx="62"/>
  </g>

  <!-- table -->
  <rect x="60" y="700" width="780" height="20" fill="#12241A"/>
  <rect x="60" y="720" width="780" height="150" fill="#FBFAF6" stroke="#C6D3C7" stroke-width="3"/>

  <!-- papers on the table -->
  <g>
    <rect x="120" y="756" width="180" height="80" fill="#F2F5F0" stroke="#C6D3C7" stroke-width="3" transform="rotate(-4 210 796)"/>
    <rect x="360" y="748" width="180" height="90" fill="#FBFAF6" stroke="#C6D3C7" stroke-width="3" transform="rotate(3 450 793)"/>
    <rect x="600" y="758" width="180" height="78" fill="#F2F5F0" stroke="#C6D3C7" stroke-width="3" transform="rotate(-2 690 797)"/>
  </g>
  <g fill="#C6D3C7">
    <rect x="150" y="778" width="110" height="8" transform="rotate(-4 205 782)"/>
    <rect x="150" y="798" width="80" height="8" transform="rotate(-4 190 802)"/>
    <rect x="390" y="772" width="110" height="8" transform="rotate(3 445 776)"/>
    <rect x="390" y="792" width="80" height="8" transform="rotate(3 430 796)"/>
    <rect x="630" y="780" width="110" height="8" transform="rotate(-2 685 784)"/>
  </g>

  <!-- baseline rule -->
  <rect x="60" y="920" width="780" height="4" fill="#12241A"/>
  <g fill="#64756A">
    <rect x="60" y="952" width="150" height="10"/>
    <rect x="60" y="984" width="96" height="10"/>
  </g>
</svg>
